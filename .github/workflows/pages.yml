name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quellstand auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Geprüftes Deploymentpaket bauen
        run: npm run deployment:build
      - name: Deploymentpaket für Pages bereitstellen
        run: |
          deployment_dir="$(find outputs -maxdepth 1 -type d -name 'deployment-*' -print -quit)"
          test -n "$deployment_dir"
          mkdir _site
          cp -R "$deployment_dir"/. _site/
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
